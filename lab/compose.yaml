# Dedicated Elastic 9.5.5 lab for the portal (trial license, Fleet, Elastic Defend
# package, detection engine). Isolated from any other stack on this machine:
# own network, own volumes, host ports 9201 / 5602 on 127.0.0.1 only.
#
#   lab/init.sh                                     # once: generate lab/.env
#   docker compose -f lab/compose.yaml up -d        # ES, Kibana, Fleet Server
#   lab/setup.sh                                    # tenants, policies, rule, API keys
#   docker compose -f lab/compose.yaml --profile agents up -d   # Fleet agents
#
# Lab only: HTTP without TLS inside the network, generated passwords in lab/.env.
name: mssp-lab

x-elastic-version: &version 9.5.5

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'true'
      xpack.security.http.ssl.enabled: 'false'
      xpack.security.transport.ssl.enabled: 'false'
      xpack.license.self_generated.type: trial
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?run lab/init.sh}
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    volumes: [esdata:/usr/share/elasticsearch/data]
    ports: ['127.0.0.1:9201:9200']
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -sf -u elastic:$$ELASTIC_PASSWORD http://localhost:9200/_cluster/health | grep -qE ''"status":"(green|yellow)"'''
        ]
      interval: 10s
      retries: 30

  # Sets the kibana_system password once Elasticsearch is up.
  es-init:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5
    depends_on: { elasticsearch: { condition: service_healthy } }
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      KIBANA_PASSWORD: ${KIBANA_PASSWORD:?run lab/init.sh}
    entrypoint: ['bash', '-c']
    command:
      - >
        until curl -sf -u elastic:$$ELASTIC_PASSWORD -H 'Content-Type: application/json'
        http://elasticsearch:9200/_security/user/kibana_system/_password
        -d "{\"password\":\"$$KIBANA_PASSWORD\"}"; do sleep 3; done; echo kibana_system ready
    restart: 'no'

  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.5
    depends_on: { es-init: { condition: service_completed_successfully } }
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${KIBANA_PASSWORD}
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: ${KIBANA_ENCRYPTION_KEY:?run lab/init.sh}
      XPACK_SECURITY_ENCRYPTIONKEY: ${KIBANA_ENCRYPTION_KEY}
      XPACK_REPORTING_ENCRYPTIONKEY: ${KIBANA_ENCRYPTION_KEY}
    volumes: ['./kibana.yml:/usr/share/kibana/config/kibana.yml:ro']
    ports: ['127.0.0.1:5602:5601']
    healthcheck:
      test:
        ['CMD-SHELL', 'curl -sf http://localhost:5601/api/status | grep -q ''"level":"available"''']
      interval: 10s
      retries: 60

  fleet-server:
    image: docker.elastic.co/elastic-agent/elastic-agent-wolfi:9.5.5
    hostname: lab-fleet-server
    depends_on: { kibana: { condition: service_healthy } }
    environment:
      FLEET_SERVER_ENABLE: '1'
      FLEET_SERVER_POLICY_ID: fleet-server-policy
      FLEET_SERVER_ELASTICSEARCH_HOST: http://elasticsearch:9200
      FLEET_SERVER_INSECURE_HTTP: '1'
      FLEET_SERVER_HOST: 0.0.0.0 # reachable by agents on the lab network
      FLEET_URL: http://fleet-server:8220
      KIBANA_FLEET_SETUP: '1'
      KIBANA_FLEET_HOST: http://kibana:5601
      KIBANA_FLEET_USERNAME: elastic
      KIBANA_FLEET_PASSWORD: ${ELASTIC_PASSWORD}
      KIBANA_HOST: http://kibana:5601
      KIBANA_USERNAME: elastic
      KIBANA_PASSWORD: ${ELASTIC_PASSWORD}
    # No host port: agents enrol over the lab network. Publish one for the VM step.

  # --- Fleet agents (profile "agents"); enrollment tokens come from lab/setup.sh ---
  # Containerised agents are real Fleet agents. Elastic Defend cannot run inside a
  # container, so its component reports a failure there (a realistic case).
  agent-acme-ws-001: &agent
    profiles: [agents]
    image: docker.elastic.co/elastic-agent/elastic-agent-wolfi:9.5.5
    hostname: ACME-WS-001
    environment: &agent-env
      FLEET_ENROLL: '1'
      FLEET_URL: http://fleet-server:8220
      FLEET_INSECURE: '1'
      FLEET_ENROLLMENT_TOKEN: ${ACME_WORKSTATIONS_TOKEN:-}
  agent-acme-ws-002:
    <<: *agent
    hostname: ACME-WS-002
  agent-acme-srv-001:
    <<: *agent
    hostname: ACME-SRV-001
    environment:
      <<: *agent-env
      FLEET_ENROLLMENT_TOKEN: ${ACME_SERVERS_TOKEN:-}
  agent-globex-ws-001:
    <<: *agent
    hostname: GLBX-WS-001
    environment:
      <<: *agent-env
      FLEET_ENROLLMENT_TOKEN: ${GLOBEX_ENDPOINTS_TOKEN:-}

volumes:
  esdata:
